[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp-lint"
dynamic = ["version"]
description = "Check VASP input files (INCAR, POSCAR, POTCAR, KPOINTS) for common mistakes before you submit, with a link to the VASP wiki for every check."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nabil Khossossi" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["vasp", "dft", "lint", "incar", "computational-chemistry", "materials-science", "pre-commit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
vasp-lint = "vasp_lint.cli:main"

[project.urls]
Source = "https://github.com/NabKh/vasp-lint"
Issues = "https://github.com/NabKh/vasp-lint/issues"

[tool.setuptools.dynamic]
version = { attr = "vasp_lint.__version__" }

[tool.setuptools.packages.find]
include = ["vasp_lint*"]

[tool.ruff]
line-length = 120
